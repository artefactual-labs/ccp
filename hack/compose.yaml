---
name: ccp

volumes:
  mysql_data:
  ccp_data:

networks:
  backend:
    driver: bridge

services:
  mysql:
    image: "percona/percona-server:8.4.5"
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci"
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: "CCP"
      MYSQL_USER: "archivematica"
      MYSQL_PASSWORD: "demo"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p12345",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - "./etc/mysql/tuning.cnf:/etc/my.cnf.d/tuning.cnf:ro"
      - "mysql_data:/var/lib/mysql"
    networks:
      - "backend"
    ports:
      - "127.0.0.1:63001:3306"
    cap_add:
      - "SYS_NICE"

  ccp:
    build:
      context: "../"
      target: "ccp"
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    restart: "on-failure"
    environment:
      - "CCP_DEBUG=true"
      - "CCP_V=10"
      - "CCP_SHARED_DIR=/var/archivematica/sharedDirectory"
      - "CCP_DB_DRIVER=mysql"
      - "CCP_DB_DSN=root:12345@tcp(mysql:3306)/CCP"
      - "CCP_API_ADMIN_ADDR=:8000"
      - "CCP_WEBUI_ADDR=:8001"
      - "CCP_METRICS_ADDR=:7999"
      - "CCP_PROVISIONER_TYPE=local"
    volumes:
      - "./submodules/archivematica-sampledata/:/home/archivematica/archivematica-sampledata/:ro"
      - "ccp_data:/var/archivematica/sharedDirectory:rw"
    networks:
      - "backend"
    ports:
      - "63030:8000"
      - "63031:8001"

  worker:
    build:
      context: "../"
      target: "worker"
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.5}
    environment:
      DJANGO_SECRET_KEY: "12345"
      ARCHIVEMATICA_WORKER_GEARMAN_SERVER: "ccp:4730"
      ARCHIVEMATICA_WORKER_CAPTURE_CLIENT_SCRIPT_OUTPUT: "true"
      ARCHIVEMATICA_WORKER_DB_USER: "archivematica"
      ARCHIVEMATICA_WORKER_DB_PASSWORD: "demo"
      ARCHIVEMATICA_WORKER_DB_HOST: "mysql"
      ARCHIVEMATICA_WORKER_DB_DATABASE: "CCP"
      XML_CATALOG_FILES: "/src/hack/submodules/archivematica-sampledata/xml-validation/catalog.xml"
    volumes:
      - "ccp_data:/var/archivematica/sharedDirectory:rw"
    networks:
      - "backend"

  migrate:
    build:
      context: "../"
      target: "worker"
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12.5}
    entrypoint: >
      /src/manage.py install
        --wait-for-db
        --migrate
        --username="test"
        --password="test"
        --email="test@test.com"
        --org-name="test"
        --org-id="test"
        --api-key="test"
        --site-url="http://archivematica-dashboard:8000"
        --skip-checks
    environment:
      DJANGO_SECRET_KEY: "12345"
      ARCHIVEMATICA_WORKER_GEARMAN_SERVER: "ccp:4730"
      ARCHIVEMATICA_WORKER_CAPTURE_CLIENT_SCRIPT_OUTPUT: "true"
      ARCHIVEMATICA_WORKER_DB_USER: "archivematica"
      ARCHIVEMATICA_WORKER_DB_PASSWORD: "demo"
      ARCHIVEMATICA_WORKER_DB_HOST: "mysql"
      ARCHIVEMATICA_WORKER_DB_DATABASE: "CCP"
    networks:
      - "backend"
