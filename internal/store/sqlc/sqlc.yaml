version: 2

cloud:
  project: "01HECEDJYX2P7ZW9DJ34T9AB0Y"

plugins:
  - name: golang
    wasm:
      url: https://github.com/sqlc-dev/sqlc-gen-go/releases/download/v1.5.0/sqlc-gen-go_1.5.0.wasm
      sha256: 4ca52949f4dc04b55188439f5de0ae20af2a71e3534b87907f2a7f466bda59ec

sql:
  - schema: mysql/schema.sql
    queries: mysql/query.sql
    engine: mysql
    database:
      managed: true
    codegen:
      - plugin: golang
        out: ../sqlcmysql
        options:
          package: sqlcmysql
          emit_interface: false
          emit_prepared_queries: true
          emit_empty_slices: true
          emit_result_struct_pointers: true
          emit_params_struct_pointers: true
          rename:
            "pk": "ID"
            "uuid": "UUID"
            "jobuuid": "ID"
            "jobtype": "Type"
            "sipuuid": "SIPID"
            "createdtime": "CreatedAt"
            "updatedtime": "UpdatedAt"
            "microservicechainlink": "LinkID"
            "microservicechainlinkspk": "LinkID"
            # table todo
            # left: name of table, lowercase, also singualrized otherwise it doesn't match

          # In overrides, `column` must refer to the table and column name in the
          # database schema, but matching is only possible in lowercase.
          overrides:
            - column: "jobs.microservicechainlinkspk"
              go_type:
                import: "github.com/google/uuid"
                package: "uuid"
                type: "NullUUID"
                pointer: false
            - column: "unitvariables.microservicechainlink"
              go_type:
                import: "github.com/google/uuid"
                package: "uuid"
                type: "NullUUID"
                pointer: false
            - column: "transfers.transfermetadatasetrowuuid"
              go_type:
                import: "github.com/google/uuid"
                package: "uuid"
                type: "NullUUID"
                pointer: false
            - column: "*.*uuid"
              go_type:
                import: "github.com/google/uuid"
                package: "uuid"
                type: "UUID"
                pointer: false
            - column: "unitvariables.pk"
              go_type:
                import: "github.com/google/uuid"
                package: "uuid"
                type: "UUID"
                pointer: false
