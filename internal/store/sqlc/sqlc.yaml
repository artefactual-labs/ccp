version: "2"
cloud:
  project: "01HECEDJYX2P7ZW9DJ34T9AB0Y"
sql:
  - name: mysql
    schema: mysql/schema.sql
    queries: mysql/query.sql
    engine: mysql
    database:
      uri: "root:12345@tcp(127.0.0.1:63001)/CCP"
    rules:
      - sqlc/db-prepare
      - mysql
    gen:
      go:
        package: sqlcmysql
        out: ../sqlcmysql
        emit_prepared_queries: true
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        rename:
          "pk": "ID"
          "uuid": "UUID"
          "jobuuid": "ID"
          "jobtype": "Type"
          "sipuuid": "SIPID"
          "createdtime": "CreatedAt"
          "updatedtime": "UpdatedAt"
          "microservicechainlink": "LinkID"
          "microservicechainlinkspk": "LinkID"
          # table todo
          # left: name of table, lowercase, also singualrized otherwise it doesn't match
        # In overrides, `column` must refer to the table and column name in the
        # database schema, but matching is only possible in lowercase.
        overrides:
          - column: "jobs.microservicechainlinkspk"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "NullUUID"
              pointer: false
          - column: "unitvariables.microservicechainlink"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "NullUUID"
              pointer: false
          - column: "transfers.transfermetadatasetrowuuid"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "NullUUID"
              pointer: false
          - column: "*.*uuid"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
              pointer: false
          - column: "unitvariables.pk"
            go_type:
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
              pointer: false
rules:
  - name: mysql
    message: "invalid engine: use mysql only"
    rule: |
      config.engine != "mysql"
