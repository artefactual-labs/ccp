name: Tests
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  lint-protos:
    name: Lint protos
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - uses: bufbuild/buf-lint-action@v1
      - uses: bufbuild/buf-push-action@v1
        if: github.ref_name == 'ccp'
        with:
          buf_token: ${{ secrets.BUF_TOKEN }}
  golangci-lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Just
        uses: extractions/setup-just@v2
      - name: Get date
        id: get-date
        shell: bash
        run: echo "date=$(date -u '+%Y-%')" >> "$GITHUB_OUTPUT"
      - name: Restore golangci-lint cache
        uses: actions/cache@v4
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/golangci-lint-cache
          key: ${{ runner.os }}-golangci-lint-cache-${{ steps.get-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-cache-
      - name: Run golangci-lint
        run: just lint --fix=0
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/golangci-lint-cache
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Just
        uses: extractions/setup-just@v2
      - name: Run tests
        run: just test "" "-race"
  mod:
    name: Check mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check
        run: go mod tidy -diff
